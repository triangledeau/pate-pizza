<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuisine</title>
<link rel="stylesheet" href="commun/theme.css">
<script src="commun/natif.js"></script>
<script src="commun/illus.js"></script>
<script src="commun/habillage.js"></script>
<style>
/* Page Cuisine : semaine, recettes, courses, repères. Le système commun est dans commun/theme.css. */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > .field{flex:1;min-width:0;width:auto}
.banner{margin:4px 0 12px;padding:12px 14px;border-radius:12px;background:var(--safran-doux);border:1px solid color-mix(in srgb,var(--safran) 40%,transparent);font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .grow{flex:1;min-width:180px}
.alert{display:inline-block;font-size:13px;font-weight:600;color:var(--tomate);background:var(--tomate-doux);border-radius:6px;padding:2px 8px;margin-top:6px}
.empty{margin-top:20px;padding:20px;border:1.5px dashed var(--trait);border-radius:var(--r-carte);color:var(--encre-2);font-size:15.5px;background:var(--surface)}
.confirm{margin-top:12px;padding:12px 14px;border:1px solid var(--tomate);background:var(--tomate-doux);border-radius:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:15px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.foot .grow{flex:1}
a.link{color:var(--basilic);font-weight:600}
.eyebrow{display:block;font-size:14px;font-weight:600;color:var(--encre-3)}

/* ---------- semaine ---------- */
.ce-soir{margin:4px 0 22px}
.plaque .note{margin-top:8px;font-size:15px;opacity:.88}
.plaque .alert{background:rgba(255,255,255,.18);color:var(--plaque-encre)}
.wk-nav{display:flex;align-items:center;gap:10px}
.btn.icon svg,.cu-pied .btn svg{width:26px;height:26px;stroke-width:2.2}
.wk-title{flex:1;min-width:0}
.wk-title h2{font-family:var(--titre);font-weight:720;font-size:22px;line-height:1.15;letter-spacing:-.01em;margin:2px 0 0;text-wrap:balance}
.garde{display:inline-block;font-size:13.5px;font-weight:600;color:var(--encre-3)}
.garde.avec{color:var(--safran)}
.wk-sum{margin:6px 0 0;font-size:14.5px;color:var(--encre-2)}
.jours{margin-top:14px;background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-carte);overflow:hidden}
.jour{display:grid;grid-template-columns:62px 1fr;border-top:1px solid var(--trait-doux)}
.jour:first-child{border-top:0}
.jour-date{padding:14px 0 10px 14px;display:flex;flex-direction:column;line-height:1}
.jour-date .js{font-size:14px;font-weight:600;color:var(--encre-3)}
.jour-date .jn{font-family:var(--titre);font-weight:760;font-size:30px;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.jour.today{background:var(--safran-doux);box-shadow:inset 4px 0 0 var(--safran-vif)}
.jour.today .jn{color:var(--safran)}
.jour.past .jour-repas,.jour.past .jour-date{opacity:.55}
.jour-repas{padding:8px 10px 8px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.jour-tag{font-size:13px;font-weight:600;color:var(--safran);padding:6px 8px 0}
.meal{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 8px;min-width:0;min-height:48px}
.meal:active{background:var(--surface-2)}
.meal .mom{font-size:13.5px;font-weight:600;color:var(--encre-3)}
.meal .nm{display:block;font-weight:700;font-size:17px;line-height:1.3;margin-top:1px}
.meal .mt{display:block;font-size:14px;color:var(--encre-2);margin-top:2px}
.meal .nt{display:block;font-size:14px;color:var(--encre-3);margin-top:2px}
.meal.todo{border:1.5px dashed var(--trait);margin:4px 0}
.meal.todo .nm{font-weight:600;color:var(--encre-3)}
.meal.mini{min-height:40px;padding:6px 8px;color:var(--encre-3);font-size:14.5px;font-weight:600}
.lancer{color:var(--safran);font-weight:700}
.wk-actions{margin-top:22px;display:flex;flex-direction:column;gap:12px}

/* ---------- courses ---------- */
.period{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:2px -16px 0;padding-inline:16px;scrollbar-width:none}
.cs-sum{margin-top:12px;font-size:15px;color:var(--encre-2)}
.store{margin-top:18px;background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-carte);overflow:hidden}
.store-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.store-h h3{font-family:var(--titre);font-weight:720;font-size:21px;letter-spacing:-.01em;margin:0}
.store-h .cnt{margin-left:auto;font-size:14px;font-weight:600;color:var(--encre-3);font-variant-numeric:tabular-nums}
.store-h .sw{width:12px;height:12px;border-radius:50%;flex:none}
.store-note{padding:0 16px 10px;font-size:14px;color:var(--encre-2);border-bottom:1px solid var(--trait-doux)}
.sub-h{padding:12px 16px 4px;font-size:14px;font-weight:700;color:var(--encre-2)}
.it{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--trait-doux);cursor:pointer;min-height:56px}
.it:last-child{border-bottom:0}
.it input[type=checkbox],.prod input[type=checkbox]{width:26px;height:26px;margin:0;accent-color:var(--basilic);cursor:pointer}
.it .tx,.prod .tx{min-width:0}
.it .tx b{display:block;font-weight:600;font-size:16.5px;line-height:1.3}
.it .tx small,.prod .tx small{display:block;font-size:13px;color:var(--encre-3);line-height:1.35;margin-top:1px}
.it .q{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;color:var(--basilic);text-align:right;white-space:nowrap}
.it.done .tx b,.prod.done .tx b{text-decoration:line-through;color:var(--encre-3)}
.it.done .q{color:var(--encre-3)}
.prod{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--trait-doux)}
.prod .tx b{display:block;font-weight:600;font-size:15.5px;line-height:1.3}
.prod.off .tx b{color:var(--encre-3);font-weight:400}
.prod .tx .pour{display:block;font-size:13px;color:var(--basilic);font-weight:600;line-height:1.35;margin-top:2px}
.sub-h.rayon{padding:14px 16px 6px;font-size:13.5px;color:var(--encre-3);border-bottom:1px solid var(--trait-doux);background:var(--surface-2)}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:38px;height:38px;border:1px solid var(--trait);background:var(--surface-2);border-radius:10px;font-size:18px;line-height:1}
.qty span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
details.more summary{padding:12px 16px;cursor:pointer;font-size:15px;color:var(--basilic);font-weight:700;list-style:none;border-bottom:1px solid var(--trait-doux)}
details.more summary::-webkit-details-marker{display:none}
.total{display:flex;justify-content:space-between;padding:12px 16px;font-size:15px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.add{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
.add .field{flex:1 1 180px;width:auto}
.add select.field{flex:0 0 auto;width:auto}

/* ---------- recettes ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.rlist{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
@media (min-width:600px){.rlist{grid-template-columns:1fr 1fr}}
.rcard{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-carte);padding:14px 16px;min-width:0}
.rcard:active{background:var(--surface-2)}
.rcard .nm{font-family:var(--titre);font-weight:700;font-size:21px;line-height:1.12;letter-spacing:-.01em}
.rcard .mt{font-size:14px;color:var(--encre-2)}
.src{font-size:13.5px;font-weight:600;color:var(--encre-3)}

/* ---------- feuille ---------- */
.scrim{position:fixed;inset:0;background:var(--voile);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--fond);border-radius:22px 22px 0 0;max-height:90vh;overflow-y:auto;box-shadow:var(--ombre);overscroll-behavior:contain;
  padding:8px max(18px,var(--sar)) calc(24px + var(--sab)) max(18px,var(--sal))}
@media (min-width:720px){.sheet{left:50%;right:auto;width:660px;transform:translateX(-50%);bottom:auto;top:5vh;border-radius:20px;max-height:88vh}}
.grip{width:44px;height:5px;border-radius:3px;background:var(--trait);margin:4px auto 12px}
.sheet h2{font-family:var(--titre);font-weight:760;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
.sheet .sec{margin-top:18px}
.sheet .sec > h3{font-family:var(--titre);font-size:19px;font-weight:700;color:var(--encre);margin:0 0 10px}
.pick{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto;border:1px solid var(--trait);border-radius:12px;padding:6px;background:var(--surface)}
.pick button{text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 10px;font-weight:600}
.pick button[aria-pressed="true"]{background:var(--basilic-doux);border-color:var(--basilic)}
.pick button small{display:block;color:var(--encre-3);font-size:13px;font-weight:400}
.ings{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--trait);border-radius:12px}
.ings li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;padding:9px 14px;border-bottom:1px solid var(--trait-doux);font-size:15.5px}
.ings li:last-child{border-bottom:0}
.ings .q{color:var(--basilic);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ens{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.ens.GF{background:var(--gf-doux);color:var(--gf)} .ens.LEC{background:var(--lec-doux);color:var(--lec)}
.ens.PIC{background:var(--pic-doux);color:var(--pic)} .ens.PLA{background:var(--pla-doux);color:var(--pla)} .ens.RES{background:var(--surface-2);color:var(--encre-3)}
.steps{margin:0;padding-left:24px}
.steps li{margin-bottom:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:15px;color:var(--encre-2)}
.meta b{font-weight:700;color:var(--encre)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border:1px solid var(--trait);background:var(--surface);border-radius:12px;font-size:20px}
.stepper span{min-width:100px;text-align:center;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.cta .btn{flex:1 1 auto}

/* ---------- fiche détaillée ---------- */
.sub{font-size:16px;color:var(--encre-2);margin-top:4px}
.num{color:var(--basilic)}
.intro{margin:14px 0 0;font-size:16px;color:var(--encre-2);max-width:62ch}
.blocs{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.blocs{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.bloc{background:var(--surface);border:1px solid var(--trait);border-radius:12px;padding:11px 13px;font-size:14.5px;color:var(--encre-2)}
.bloc b{display:block;font-family:var(--titre);font-weight:700;font-size:17px;color:var(--encre);margin-bottom:2px}
.retro{list-style:none;margin:0;padding:0;border-left:2px solid var(--trait);margin-left:6px}
.retro li{position:relative;padding:0 0 12px 18px;font-size:15px}
.retro li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--fond);border:2px solid var(--basilic)}
.retro b{font-weight:700;color:var(--basilic);margin-right:8px;font-variant-numeric:tabular-nums}
.etape{margin-top:22px;padding-top:16px;border-top:1px solid var(--trait)}
.etape h3{font-family:var(--titre);font-weight:720;font-size:22px;line-height:1.15;margin:0;color:var(--encre)}
.etape .dur{display:block;font-size:14px;font-weight:600;color:var(--safran);margin:3px 0 12px}
.etape .ings{margin-bottom:12px}
.steps.big li{margin-bottom:12px;line-height:1.55;padding-left:4px;font-size:16px}
.steps.big li::marker{font-family:var(--titre);font-weight:700;color:var(--basilic)}
.tip{margin:4px 0 14px;padding:10px 14px;border-left:4px solid var(--safran-vif);background:var(--safran-doux);border-radius:0 12px 12px 0;font-size:15px}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pts li{background:var(--surface);border:1px solid var(--trait);border-radius:12px;padding:10px 13px;font-size:15px;color:var(--encre-2)}
.pts li b{color:var(--encre)}
.prog{display:inline-flex;align-items:center;gap:8px;margin:6px 0 2px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--tomate);color:var(--tomate);background:var(--tomate-doux);font-size:14.5px;font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums}
.prog svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- mode cuisine : une étape à la fois, en grand ---------- */
.cuisiner{position:fixed;inset:0 0 calc(var(--nav-h) + var(--sab)) 0;z-index:14;background:var(--fond);display:flex;flex-direction:column}
.cu-tete{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) max(16px,var(--sar)) 10px max(16px,var(--sal))}
.cu-tete .nom{flex:1;min-width:0;font-weight:700;font-size:15px;color:var(--encre-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cu-barre{display:flex;gap:3px;padding:0 max(16px,var(--sar)) 0 max(16px,var(--sal))}
.cu-barre span{flex:1;height:5px;border-radius:3px;background:var(--trait)}
.cu-barre span.fait{background:var(--basilic)}
.cu-barre span.ici{background:var(--safran-vif)}
.cu-corps{flex:1;overflow-y:auto;padding:20px max(20px,var(--sar)) 24px max(20px,var(--sal));max-width:720px;width:100%;margin:0 auto}
.cu-section{font-size:15px;font-weight:700;color:var(--safran)}
.cu-num{font-family:var(--titre);font-weight:780;font-size:48px;line-height:1;color:var(--basilic);margin-top:8px;font-variant-numeric:tabular-nums}
.cu-num small{font-size:20px;color:var(--encre-3);font-weight:600}
.cu-texte{font-size:23px;line-height:1.45;margin:12px 0 16px;text-wrap:pretty}
.cu-pied{display:flex;gap:12px;padding:12px max(16px,var(--sar)) 12px max(16px,var(--sal));border-top:1px solid var(--trait);background:var(--surface)}
.cu-pied .btn{min-height:68px;font-size:19px;border-radius:16px}
.cu-pied .btn.ghost{flex:0 0 96px}
.cu-pied .btn.primary{flex:1}
.cu-ings{margin-top:6px}
.cu-ings summary{cursor:pointer;font-weight:700;color:var(--basilic);padding:8px 0;list-style:none}
.cu-ings summary::-webkit-details-marker{display:none}

/* ---------- repères ---------- */
.rp{margin-top:24px}
.rp:first-child{margin-top:8px}
.rp-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rp-h h2{font-family:var(--titre);font-weight:720;font-size:23px;letter-spacing:-.01em;margin:0;flex:1}
.card{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r-carte)}
.rules{list-style:none;margin:0;padding:0}
.rules li{padding:11px 16px;border-bottom:1px solid var(--trait-doux);font-size:15.5px}
.rules li:last-child{border-bottom:0}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-size:13.5px;font-weight:600;color:var(--encre-3);text-align:left;padding:10px 14px;border-bottom:1px solid var(--trait)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--trait-doux);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.equip{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.equip{grid-template-columns:1fr 1fr}}
.eq{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--trait);border-radius:12px;padding:12px 14px;min-width:0}
.eq .nm{display:block;font-weight:700;font-size:16px}
.eq .mt{display:block;font-size:14px;color:var(--encre-2)}
.eq .mq{display:block;font-size:13px;color:var(--tomate);margin-top:2px}
.todo-l{list-style:none;margin:0;padding:0}
.todo-l label{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;padding:11px 16px;border-bottom:1px solid var(--trait-doux);cursor:pointer;font-size:15.5px}
.todo-l li:last-child label{border-bottom:0}
.todo-l input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--basilic)}
.todo-l .done span{text-decoration:line-through;color:var(--encre-3)}
.sync-l{font-size:14px;color:var(--encre-3)}

/* ---------- habillage : cartes en relief, vignettes illustrées, mouvements ---------- */
.jours,.store,.rcard,.card,.eq,.ings,.bloc,.pts li,.pick{border-color:var(--trait-doux);box-shadow:var(--ombre-carte)}
.empty{display:flex;gap:16px;align-items:center;border-style:dashed;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.empty .illus{flex:none;width:58px;height:58px}
.salut{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--encre-2)}
.salut b{color:var(--encre);font-weight:700}
/* semaine */
.jour{transition:background-color .2s}
.meal{transition:background-color .15s,transform .12s var(--sortie)}
.meal:active{transform:scale(.985)}
.meal.avec-v{display:flex;gap:12px;align-items:center}
.meal .vignette{width:46px;height:46px;padding:6px;border-radius:13px}
.meal-tx{display:block;min-width:0;flex:1}
.jours.va-d,.wk-title.va-d{animation:glisse-d .3s var(--sortie)}
.jours.va-g,.wk-title.va-g{animation:glisse-g .3s var(--sortie)}
.wk-nav .btn.icon{border-radius:50%;box-shadow:var(--ombre-carte)}
/* recettes */
.rcard{flex-direction:row;align-items:center;gap:14px;transition:transform .12s var(--sortie),box-shadow .2s}
.rcard:active{transform:scale(.985)}
.rcard .vignette{width:68px;height:68px;padding:8px;border-radius:16px}
.rc-tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.rlist .squelette{min-height:100px}
/* fiche : la vignette en grand, comme une photo de plat */
.vignette.hero{width:100%;height:164px;border-radius:20px;padding:20px;margin:2px 0 16px;position:relative;overflow:hidden}
.vignette.hero .illus{width:124px;height:124px;position:relative}
.vignette.hero::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;left:50%;top:50%;margin:-75px 0 0 -75px;
  background:radial-gradient(circle,color-mix(in srgb,#fff 55%,transparent),transparent 70%)}
@media (prefers-color-scheme:dark){.vignette.hero::before{background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%)}}
.ouverture .vignette.hero .illus{animation:pose .45s var(--ressort) both .1s}
.etape h3{display:flex;align-items:center;gap:10px}
.etape h3::before{content:"";flex:none;width:10px;height:10px;border-radius:3px;background:var(--safran-vif);transform:rotate(45deg)}
/* courses */
.store-h .ens-ico{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--cd);color:var(--c)}
.ens-ico svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.store-prog{height:4px;margin:0 16px 10px;border-radius:2px;background:var(--trait-doux);overflow:hidden}
.store-prog span{display:block;height:100%;border-radius:2px;background:var(--c);transition:width .3s var(--sortie)}
.store.fini .store-h h3::after{content:" ✓";color:var(--c)}
.it,.prod{transition:background-color .15s}
.it:active{background:var(--surface-2)}
.qty button{transition:transform .12s var(--sortie)}
.qty button:active{transform:scale(.88)}
/* mode cuisine */
.cuisiner{animation:feuille-monte .3s var(--sortie)}
.cuisiner.sort{animation:feuille-descend .2s var(--entree) both}
.cu-tete .vignette{width:38px;height:38px;padding:4px;border-radius:11px}
.cu-corps.va-d > *{animation:glisse-d .28s var(--sortie) both}
.cu-corps.va-g > *{animation:glisse-g .28s var(--sortie) both}
.cu-barre span{transition:background-color .3s}

<script>
(() => {
/* ================= constantes ================= */
const ENS = {
  GF: {nom: "Grand Frais", note: "Fruits, légumes, viande et poisson frais."},
  LEC: {nom: "Drive Leclerc", note: "Épicerie, crèmerie, charcuterie emballée. Bio si +30 % max, sinon marques nationales."},
  PIC: {nom: "Picard", note: "Tous les surgelés, une semaine sur deux."},
  PLA: {nom: "Placard", note: "Coche ce que tu as déjà ; le reste passe sur le drive."},
  RES: {nom: "Restes"},
  NON: {nom: ""}
};
const ORDRE = ["GF", "LEC", "PIC", "PLA"];
const JOURS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const MOM = {midi: "Midi", soir: "Dîner"};
const JOURS_LONGS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const MOIS_LONGS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const APPAREILS = ["Air-fryer", "Cook Expert", "Pummarola", "Cuiseur à riz", "Four", "Plaques"];
const FROMAGES_NON = ["pecorino", "chèvre", "chevre", "brebis", "roquefort", "gorgonzola", "bleu d'", "camembert", "brie", "feta", "féta", "ricotta", "mascarpone", "boursin", "fromage frais", "reblochon", "munster", "burrata"];
const FILS_NON = ["chou de bruxelles", "choux de bruxelles", "cœur de palmier", "cœurs de palmier", "coeur de palmier", "coeurs de palmier"];

/* ================= état ================= */
const st = {db: null, dbTried: false, canWrite: true, recettes: {}, semaines: {}, drive: null,
  reglages: {gardeRef: "2026-11-06", periodeJours: 14}, courses: null, reperes: null, equipement: {}, loaded: {r: false, s: false, c: false, d: false}};
const ui = {view: "semaine", week: null, periode: "7", hideDone: false, rq: "", rCourt: false, rApp: null, rSrc: false};
try { const s = JSON.parse(localStorage.getItem("cuisine-ui") || "{}"); if (s.periode) ui.periode = s.periode; if (s.hideDone) ui.hideDone = true; } catch (e) {}
const saveUi = () => { try { localStorage.setItem("cuisine-ui", JSON.stringify({periode: ui.periode, hideDone: ui.hideDone})); } catch (e) {} };

/* ================= utilitaires ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const weekStartOf = d => addDays(d, -((d.getDay() + 2) % 7)); // semaine du vendredi au jeudi
const fmtDay = d => JOURS[d.getDay()] + " " + d.getDate() + " " + MOIS[d.getMonth()];
const daysBetween = (a, b) => Math.round((b - a) / 864e5);
const avecFils = ws => { const n = daysBetween(parse(st.reglages.gardeRef || "2026-11-06"), parse(ws)); const p = st.reglages.periodeJours || 14; return ((n % p) + p) % p === 0; };
const couvert = (i, mom) => (i === 0 && mom === "soir") || i === 1 || i === 2 || (i >= 3 && mom === "soir") || (i === 5 && mom === "midi");
const fmtMin = m => { if (!m && m !== 0) return ""; if (m < 60) return m + " min"; const h = Math.floor(m / 60), r = m % 60; return h + " h" + (r ? " " + pad(r) : ""); };
const fmtHeure = t => t ? t.replace(":", " h ") : "";
const num = x => { const r = Math.round(x * 10) / 10; return String(Number.isInteger(r) ? r : r.toFixed(1)).replace(".", ","); };
function fmtQ(q, u) {
  if (q == null || q === "") return u || "";
  if (u === "g" && q >= 1000) return num(q / 1000) + " kg";
  if (u === "ml" && q >= 1000) return num(q / 1000) + " L";
  return num(q) + (u ? " " + u : "");
}
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function alertes(r) {
  const out = [], txt = (r.ingredients || []).map(i => i.n.toLowerCase()).join(" | ") + " " + (r.nom || "").toLowerCase();
  const f = FROMAGES_NON.filter(w => txt.includes(w)); if (f.length) out.push("Fromage à éviter : " + f[0]);
  const g = FILS_NON.filter(w => txt.includes(w)); if (g.length) out.push("Ton fils n'en mange pas : " + g[0]);
  return out;
}
const vide = (txt, ill = "cloche") => `<div class="empty">${window.Illus ? Illus.plat(ill) : ""}<span>${txt}</span></div>`;
const salut = () => { const h = new Date().getHours(); return h < 5 ? "Bonne nuit" : h < 12 ? "Bonjour" : h < 18 ? "Bon après-midi" : "Bonsoir"; };
let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; if (t.hidden) t.hidden = false; else window.animerUneFois?.(t, "rebond", 400); clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ================= écriture ================= */
const queues = {};
function write(path, data) {
  if (!st.db) { toast("Enregistrement impossible : données indisponibles dans cette vue."); return Promise.resolve(); }
  if (!st.canWrite) { toast("Cette page est en lecture seule pour toi."); return Promise.resolve(); }
  const run = () => st.db.doc(path).set(data).catch(e => {
    if (e && e.code === "invalid_argument") { st.canWrite = false; toast("Enregistrement refusé : page en lecture seule."); }
    else if (e && e.code === "unavailable") return new Promise(r => setTimeout(r, 600 + Math.random() * 600)).then(() => st.db.doc(path).set(data));
    else toast("Enregistrement impossible, réessaie dans un instant.");
  });
  queues[path] = (queues[path] || Promise.resolve()).then(run, run);
  return queues[path];
}
function del(path) { if (!st.db || !st.canWrite) return; st.db.doc(path).delete().catch(() => toast("Suppression impossible.")); }
const saveWeek = ws => write("semaines/" + ws, st.semaines[ws]);
let csTimer = null;
function saveCourses(now) { clearTimeout(csTimer); const go = () => write("courses/actuel", st.courses); if (now) go(); else csTimer = setTimeout(go, 500); }
function coursesDoc() { if (!st.courses) st.courses = {coches: {}, ajouts: [], driveQte: {}, picard: true}; st.courses.coches ||= {}; st.courses.ajouts ||= []; st.courses.driveQte ||= {}; if (st.courses.picard == null) st.courses.picard = true; return st.courses; }

/* ================= données dérivées ================= */
function repasEntre(d0, d1) {
  const out = [];
  for (const [ws, w] of Object.entries(st.semaines)) for (const [k, m] of Object.entries(w.repas || {})) {
    const [ds, mom] = k.split("_"); const d = parse(ds);
    if (d >= d0 && d <= d1) out.push({ws, k, d, mom, m});
  }
  return out.sort((a, b) => a.d - b.d || (a.mom === "midi" ? -1 : 1));
}
function periodeRange() {
  const t = today();
  if (ui.periode === "3") return [t, addDays(t, 2)];
  if (ui.periode === "14") return [t, addDays(t, 13)];
  if (ui.periode.startsWith("w:")) { const s = parse(ui.periode.slice(2)); return [s, addDays(s, 6)]; }
  return [t, addDays(t, 6)];
}
/* Articles (config/articles) : un même produit sous plusieurs noms de recette (« beurre froid », « beurre »)
   devient une seule ligne de courses, avec ses quantités converties dans une unité commune et son rayon. */
const cleArt = s => norm(s).replace(/\s+/g, " ").trim();
let idxArt = null;
function articleDe(n) {
  const ref = st.articles?.articles || {};
  if (!idxArt || idxArt.ref !== ref) {
    const exact = new Map();
    for (const [nom, a] of Object.entries(ref)) { exact.set(cleArt(nom), nom); for (const al of a.alias || []) exact.set(cleArt(al), nom); }
    idxArt = {ref, exact, pref: [...exact.keys()].sort((a, b) => b.length - a.length)};
  }
  let k = cleArt(n);
  if (idxArt.exact.has(k)) return idxArt.exact.get(k);
  k = cleArt(norm(n).replace(/\([^)]*\)/g, " ").split(",")[0]);
  if (idxArt.exact.has(k)) return idxArt.exact.get(k);
  const p = idxArt.pref.find(x => k.startsWith(x + " "));
  return p ? idxArt.exact.get(p) : null;
}
function ajouterQ(a, q, u, art) {
  u = u || "";
  if (art && art.u != null && u !== art.u && art.conv?.[u] != null) { q *= art.conv[u]; if (art.conv[u] !== 1) a.approx = true; u = art.u; }
  a.qs[u] = (a.qs[u] || 0) + q;
}
function texteQ(a) {
  if (a.sansQ) return "";
  const arrondi = (q, u) => !a.approx ? q : (u === "g" || u === "ml") && q > 50 ? Math.round(q / 5) * 5 : (u === "c. à s." || u === "c. à c.") ? Math.ceil(q * 2 - 0.1) / 2 : q;
  const parts = Object.entries(a.qs).map(([u, q]) => fmtQ(arrondi(q, u), u));
  return parts.length ? (a.approx ? "≈ " : "") + parts.join(" + ") : "";
}
function listeCourses() {
  const [d0, d1] = periodeRange(), meals = repasEntre(d0, d1), c = coursesDoc();
  const arts = st.articles?.articles || {}, prods = st.drive?.produits || [];
  const agg = {}, besoins = {};
  for (const x of meals) {
    const r = st.recettes[x.m.r]; if (!r) continue;
    const f = (x.m.p || r.portions) / (r.portions || 1);
    for (const ing of r.ingredients || []) {
      if (ing.e === "RES" || ing.e === "NON") continue;
      let e = ing.e; const surg = e === "PIC"; if (surg && !c.picard) e = "LEC";
      const nomA = articleDe(ing.n), art = nomA ? arts[nomA] : null;
      let a;
      if (art?.drive && e === "LEC" && prods.some(p => p.id === art.drive)) {
        // Produit habituel du drive : le besoin des recettes s'ajoute à sa ligne.
        a = besoins[art.drive] || (besoins[art.drive] = {n: nomA, qs: {}, approx: false, pour: []});
      } else {
        const key = nomA ? cleArt(nomA) + "|" + e : cleArt(ing.n) + "|" + (ing.u || "") + "|" + e;
        a = agg[key] || (agg[key] = {key: "i:" + key, n: nomA || ing.n, e, qs: {}, approx: false, pour: [], surg,
          sansQ: !!art?.sansQ, rayon: surg && e === "LEC" ? "Surgelés" : (art?.r || "")});
      }
      if (typeof ing.q === "number") ajouterQ(a, ing.q * f, ing.u, art);
      if (!a.pour.includes(r.nom)) a.pour.push(r.nom);
    }
  }
  const items = Object.values(agg);
  for (const a of items) a.qtxt = texteQ(a);
  for (const b of Object.values(besoins)) b.qtxt = texteQ(b);
  for (const a of c.ajouts) { const nomA = articleDe(a.n); items.push({key: "a:" + a.id, n: a.n, e: a.e, qtxt: "", pour: ["Ajout"], ajout: a.id, rayon: nomA ? arts[nomA].r : ""}); }
  return {meals, items, besoins};
}
// Contenance d'un produit du drive d'après son format (« x6 · 210 g », « 2 x 93 g », « 1,25 kg »).
function contenance(fmt) {
  const f = String(fmt || "").toLowerCase().replace(/,/g, ".");
  const n = f.match(/^x\s*(\d+)/) || f.match(/^(\d+)\s*x/);
  const m = f.match(/(?:(\d+)\s*x\s*)?(\d+(?:\.\d+)?)\s*(kg|g|l|cl|ml)\b/);
  return {n: n ? Number(n[1]) : null, g: m ? (m[1] ? Number(m[1]) : 1) * Number(m[2]) * {kg: 1000, g: 1, l: 1000, cl: 10, ml: 1}[m[3]] : null};
}
function paquets(p, b) {
  const c = contenance(p.format); let n = 1;
  for (const [u, q] of Object.entries(b.qs)) {
    if ((u === "g" || u === "ml") && c.g) n = Math.max(n, Math.ceil(q / c.g - 0.05));
    else if ((u === "" || u === "tranches") && c.n) n = Math.max(n, Math.ceil(q / c.n - 0.05));
  }
  return n;
}
function produitsQte(p, besoins) {
  const v = coursesDoc().driveQte[p.id]; if (v != null) return v;
  const base = p.statut === "Base" ? p.qte : 0, b = (besoins || listeCourses().besoins)[p.id];
  return b ? Math.max(base, paquets(p, b)) : base;
}
// Classe des lignes {rayon, nom, html} selon l'ordre des rayons de l'enseigne.
function parRayon(e, lignes) {
  const ordre = st.articles?.rayons?.[e] || [], g = {};
  for (const l of lignes) if (l.html) (g[l.rayon || "Divers"] ||= []).push(l);
  const rang = r => r === "Divers" ? 1e4 : (ordre.indexOf(r) + 1 || 1e3);
  return Object.keys(g).sort((a, b) => rang(a) - rang(b) || a.localeCompare(b, "fr"))
    .map(r => `<div class="sub-h rayon">${esc(r)}</div>` + g[r].sort((a, b) => a.nom.localeCompare(b.nom, "fr")).map(l => l.html).join("")).join("");
}
const rangRayon = (e, r) => { const o = st.articles?.rayons?.[e] || []; return !r ? 1e4 : (o.indexOf(r) + 1 || 1e3); };

/* ================= rendu : semaine ================= */
function prochainRepas() {
  // Le prochain repas planifié à partir de maintenant : « Ce soir », « Demain midi »…
  const now = new Date(), t = today();
  const liste = repasEntre(t, addDays(t, 7));
  for (const x of liste) {
    const fin = new Date(x.d); fin.setHours(x.mom === "midi" ? 14 : 21, 30, 0, 0);
    if (fin > now) return x;
  }
  return null;
}
function quandRepas(x) {
  const n = daysBetween(today(), x.d);
  const mom = x.mom === "midi" ? "midi" : "soir";
  if (n === 0) return x.mom === "midi" ? "Ce midi" : "Ce soir";
  if (n === 1) return "Demain " + mom;
  return JOURS[x.d.getDay()].replace(".", "") + " " + x.d.getDate() + ", " + (x.mom === "midi" ? "midi" : "dîner");
}
function lienPizza(x, r) {
  const q = new URLSearchParams({n: String(x.m.p || r.portions || 2), plat: r.nom});
  if (x.m.lancer) { const [h, mi] = x.m.lancer.split(":").map(Number); const c = new Date(2000, 0, 1, h, mi + 25); q.set("cuisson", pad(c.getHours()) + ":" + pad(c.getMinutes())); }
  return "pizza.html?" + q.toString();
}
function plaqueHtml() {
  const x = prochainRepas(); if (!x) return "";
  const r = x.m.r ? st.recettes[x.m.r] : null;
  const nom = r ? r.nom : (x.m.libre || "Repas");
  const infos = r ? [fmtMin(r.actif) + " actives", r.appareils?.length ? r.appareils.join(", ") : ""].filter(Boolean).join(", ") : "";
  const quand = quandRepas(x) + (x.m.lancer ? ", lancer à " + fmtHeure(x.m.lancer) : "");
  const al = r ? alertes(r).map(a => `<span class="alert">${esc(a)}</span>`).join(" ") : "";
  let act = "";
  if (r) {
    act += `<button class="btn" data-act="cuisiner" data-id="${esc(x.m.r)}" data-p="${x.m.p || r.portions}">Cuisiner pas à pas</button>`;
    act += `<button class="btn ghost" data-act="openRecipe" data-id="${esc(x.m.r)}">Recette</button>`;
    if (r.categorie === "Pizza") act += `<a class="btn ghost" href="${esc(lienPizza(x, r))}">Planifier la pâte</a>`;
  }
  const assiette = window.Illus ? `<span class="assiette">${Illus.plat(Illus.famille(r || x.m))}</span>` : "";
  return `<section class="ce-soir plaque${assiette ? " avec-assiette" : ""}" aria-label="Prochain repas">${assiette}<div class="quand">${esc(quand)}</div>
    <div class="plat">${esc(nom)}</div>${infos ? `<div class="infos">${esc(infos)}</div>` : ""}
    ${x.m.note ? `<div class="note">${esc(x.m.note)}</div>` : ""}${al}
    ${act ? `<div class="actions">${act}</div>` : ""}</section>`;
}
function renderSemaine() {
  const el = $("#v-semaine");
  if (!ui.week) ui.week = iso(weekStartOf(today()));
  const ws = ui.week, s = parse(ws), avec = avecFils(ws), w = st.semaines[ws] || {debut: ws, repas: {}};
  const t = today(), repas = w.repas || {};
  let nbCouv = 0, nbPlan = 0;
  const glisse = ui.glisse || ""; ui.glisse = "";
  let html = `<p class="salut">${salut()} · <b>${JOURS_LONGS[t.getDay()]} ${t.getDate()} ${MOIS_LONGS[t.getMonth()]}</b></p>` + (rappels.etat === "a-demander" ? `<div class="banner"><span class="grow">Reçois une notification à l'heure de lancer chaque dîner, avec ce qu'il faut sortir du congélateur.</span><button class="btn primary" data-act="rappelsOn">Activer les rappels</button></div>` : "")
    + plaqueHtml();
  html += `<div class="wk-nav">
    <button class="btn icon" data-act="weekPrev" aria-label="Semaine précédente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg></button>
    <div class="wk-title ${glisse}"><span class="garde ${avec ? "avec" : ""}">${avec ? "Semaine avec ton fils" : "Semaine seul"}</span>
      <h2>Du ${fmtDay(s)} au ${fmtDay(addDays(s, 6))}</h2></div>
    <button class="btn icon" data-act="weekNext" aria-label="Semaine suivante"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button></div>`;
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(s, i), ds = iso(d); let slots = "";
    for (const mom of ["midi", "soir"]) {
      const key = ds + "_" + mom, m = repas[key], cv = avec && couvert(i, mom);
      if (cv) nbCouv++;
      if (m) { nbPlan++; slots += mealCard(key, mom, m); }
      else if (cv) slots += `<button class="meal todo" data-act="editMeal" data-k="${key}"><span class="mom">${MOM[mom]}</span><span class="nm">À planifier</span></button>`;
      else slots += `<button class="meal mini" data-act="editMeal" data-k="${key}">+ ${MOM[mom]}</button>`;
    }
    const isT = +d === +t, past = d < t;
    let tag = isT ? "Aujourd'hui" : "";
    if (avec && i === 0) tag = tag ? tag + ", arrivée de ton fils" : "Arrivée de ton fils, 17 h–18 h 30";
    days.push(`<div class="jour ${isT ? "today" : ""} ${past ? "past" : ""}"><div class="jour-date"><span class="js">${JOURS[d.getDay()]}</span><span class="jn">${d.getDate()}</span></div>
      <div class="jour-repas">${tag ? `<span class="jour-tag">${tag}</span>` : ""}${slots}</div></div>`);
  }
  const sum = avec ? `${Math.min(nbPlan, 99)} repas planifiés sur ${nbCouv} à couvrir` : (nbPlan ? `${nbPlan} repas planifiés` : "Aucun repas planifié pour l'instant.");
  html += `<p class="wk-sum">${sum}</p><div class="jours cascade ${glisse}">${days.join("")}</div>`;
  const cibles = [];
  for (let k = 1; k <= 8; k++) { const c = iso(addDays(s, 7 * k)); cibles.push(`<option value="${c}">${fmtDay(parse(c))}${avecFils(c) ? ", avec ton fils" : ""}</option>`); }
  html += `<div class="wk-actions">
    <div class="row"><button class="btn" data-act="goCourses">Courses de cette semaine</button>${iso(weekStartOf(t)) !== ws ? `<button class="btn ghost" data-act="toToday">Revenir à cette semaine</button>` : ""}</div>
    <div><label class="lab" for="copyTo">Recopier cette semaine vers</label>
    <div class="row"><select class="field" id="copyTo">${cibles.join("")}</select><button class="btn" data-act="copyWeek"${nbPlan ? "" : " disabled"}>Recopier</button></div></div>
    ${nbPlan ? `<div><button class="btn danger" data-act="askClear">Vider la semaine</button></div>` : ""}
    <div id="clearZone"></div></div>`;
  el.innerHTML = html;
}
function mealCard(key, mom, m) {
  const r = m.r ? st.recettes[m.r] : null;
  const nom = r ? r.nom : (m.libre || "Recette introuvable");
  const bits = [];
  if (r) { bits.push(fmtMin(r.actif) + " actives"); if (r.appareils?.length) bits.push(r.appareils.join(", ")); }
  if (m.p && r && m.p !== 2) bits.push(m.p + " " + (r.unite || "portions"));
  const al = r ? alertes(r).map(a => `<span class="alert">${esc(a)}</span>`).join(" ") : "";
  return `<button class="meal avec-v" data-act="editMeal" data-k="${key}">${window.Illus ? Illus.vignette(r || m) : ""}<span class="meal-tx"><span class="mom">${MOM[mom]}${m.lancer ? `, <span class="lancer">lancer à ${fmtHeure(m.lancer)}</span>` : ""}</span>
    <span class="nm">${esc(nom)}</span>${bits.length ? `<span class="mt">${esc(bits.join(", "))}</span>` : ""}${m.note ? `<span class="nt">${esc(m.note)}</span>` : ""}${al}</span></button>`;
}

function renderCourses() {
  const c = coursesDoc();

  const t = today(), ws0 = weekStartOf(t);
  const weeks = Object.keys(st.semaines).filter(w => parse(w) >= ws0 && Object.keys(st.semaines[w].repas || {}).length).sort();
  const opts = [["3", "3 prochains jours"], ["7", "7 prochains jours"], ["14", "14 prochains jours"]]
    .concat(weeks.map(w => ["w:" + w, "Semaine du " + fmtDay(parse(w))]));
  if (!opts.some(o => o[0] === ui.periode)) ui.periode = "7";
  const {meals, items, besoins} = listeCourses();
  const [d0, d1] = periodeRange();
  $("#cs-top").innerHTML = `<div class="period" role="group" aria-label="Période">${opts.map(o => `<button class="chip" data-act="periode" data-v="${o[0]}" aria-pressed="${ui.periode === o[0]}">${esc(o[1])}</button>`).join("")}</div>
    <p class="cs-sum">${meals.length ? `${meals.length} repas du ${fmtDay(d0)} au ${fmtDay(d1)} : ${esc(meals.map(m => (st.recettes[m.m.r]?.nom || m.m.libre || "?")).filter((v, i, a) => a.indexOf(v) === i).join(", "))}.` : "Aucun repas planifié sur cette période. Les produits habituels du drive restent listés."}</p>
    <div class="bar"><button class="chip" data-act="picard" aria-pressed="${c.picard}">Passage Picard cette fois</button>
    <button class="chip" data-act="hideDone" aria-pressed="${ui.hideDone}">Masquer ce qui est coché</button></div>`;
  let html = "";
  for (const e of ORDRE) {
    if (e === "PIC" && !c.picard) continue;
    const its = items.filter(x => x.e === e);
    const prods = e === "LEC" ? (st.drive?.produits || []) : [];
    const qte = new Map(prods.map(p => [p.id, produitsQte(p, besoins)]));
    const pris = prods.filter(p => qte.get(p.id) > 0), restants = prods.filter(p => !qte.get(p.id));
    if (!its.length && !prods.length) continue;
    const done = its.filter(x => c.coches[x.key]).length + pris.filter(p => c.coches["p:" + p.id]).length;
    const total = its.length + pris.length;
    const ec = e.toLowerCase();
    html += `<section class="store${total && done === total ? " fini" : ""}" style="--c:var(--${ec});--cd:var(--${ec}-doux)"><div class="store-h"><span class="ens-ico">${window.Illus ? Illus.enseigne(e) : ""}</span><h3>${ENS[e].nom}</h3><span class="cnt">${done} / ${total}</span></div>
      <div class="store-prog" aria-hidden="true"><span style="width:${total ? Math.round(done / total * 100) : 0}%"></span></div>`;
    let note = ENS[e].note;
    if (e === "LEC" && !c.picard) note += " Semaine sans Picard : les surgelés sont ici.";
    html += `<div class="store-note">${esc(note)}</div>`;
    const lignes = its.map(x => {
      const dn = !!c.coches[x.key];
      return {rayon: x.rayon, nom: x.n, html: dn && ui.hideDone ? "" : `<label class="it ${dn ? "done" : ""} ${ui.vientDe === x.key ? "vient-de-cocher" : ""}"><input type="checkbox" data-act="check" data-key="${esc(x.key)}" ${dn ? "checked" : ""}>
        <span class="tx"><b>${esc(x.n)}${x.surg && e === "LEC" ? " (surgelé)" : ""}</b><small>${esc(x.pour.join(" · "))}</small></span><span class="q">${esc(x.qtxt)}</span></label>`};
    }).concat(pris.map(p => ({rayon: p.rayon, nom: p.nom, html: ligneProduit(p, qte.get(p.id), besoins[p.id])})));
    html += parRayon(e, lignes);
    if (e === "LEC" && prods.length) {
      const tri = restants.sort((a, b) => rangRayon(e, a.rayon) - rangRayon(e, b.rayon) || a.nom.localeCompare(b.nom, "fr"));
      const tot = pris.reduce((s, p) => s + qte.get(p.id) * p.prix, 0);
      html += `<details class="more"><summary>Autres produits habituels (${tri.length})</summary>${tri.map(p => ligneProduit(p, 0, besoins[p.id])).join("")}</details>
        <div class="total"><span>Produits habituels estimés</span><b>${num(tot)} €</b></div>`;
    }
    html += `</section>`;
  }
  if (!html) html = vide("Rien à acheter pour l'instant. Planifie des repas dans l'onglet Semaine, ou ajoute un article ci-dessous.");
  $("#cs-list").innerHTML = html; ui.vientDe = null;
  $("#cs-foot").innerHTML = `<div class="bar" style="margin-top:20px"><button class="btn primary" data-act="copyClaude">Copier pour Claude</button>
    <button class="btn" data-act="copyGF">Copier la liste Grand Frais</button><button class="btn ghost danger" data-act="askReset">Nouvelle liste</button></div>
    <p class="muted" style="font-size:13.5px;margin-top:8px">« Copier pour Claude » prépare un message à coller dans la conversation : je remplis alors ton panier Leclerc Drive.</p><div id="resetZone"></div>`;
}
function ligneProduit(p, q, b) {
  const dn = q > 0 && !!coursesDoc().coches["p:" + p.id];
  if (dn && ui.hideDone) return "";
  const pour = b ? `<span class="pour">Pour ${esc(b.pour.join(", "))}${b.qtxt ? " : " + esc(b.qtxt) : ""}</span>` : "";
  return `<div class="prod ${q ? "" : "off"} ${dn ? "done" : ""} ${ui.vientDe === "p:" + p.id ? "vient-de-cocher" : ""}">
      <input type="checkbox" data-act="check" data-key="p:${p.id}" ${dn ? "checked" : ""} ${q ? "" : "disabled"} aria-label="${esc(p.nom)} pris">
      <span class="tx"><b>${esc(p.nom)}</b><small>${esc(p.format)} · ${num(p.prix)} €${p.note ? " · " + esc(p.note) : ""}</small>${pour}</span>
      <span class="qty"><button data-act="pq" data-id="${p.id}" data-d="-1" aria-label="Moins">−</button><span>${q}</span><button data-act="pq" data-id="${p.id}" data-d="1" aria-label="Plus">+</button></span></div>`;
}

function lineToIng(line) {

// « EXPERT 120 °C, vitesse 1, 3 min » ou « EXPERT · 2 min 30 · vitesse 3 · 37 °C » → {tempsS, temperature, vitesse}
const SANS_CHAUFFE = 29;
function programmeDe(txt) {
  const k = txt.search(/EXPERT/); if (k < 0) return null;
  const z = txt.slice(k, k + 70);
  const v = z.match(/vitesse\s*(\d{1,2})/i); if (!v) return null;
  const tc = z.match(/(\d{2,3})\s*°C/);
  const sans = /sans chauffe/i.test(z);
  const d = z.match(/(\d+)\s*min(?:\s*(\d{1,2})(?!\s*°))?/) || null, sec = z.match(/(\d+)\s*s\b/);
  const tempsS = d ? Number(d[1]) * 60 + (d[2] ? Number(d[2]) : 0) : sec ? Number(sec[1]) : 0;
  if (!tempsS) return null;
  return {tempsS, temperature: tc ? Number(tc[1]) : (sans ? SANS_CHAUFFE : SANS_CHAUFFE), vitesse: Number(v[1])};
}
function progHtml(txt) {
  const p = programmeDe(txt); if (!p) return "";
  const t = p.tempsS >= 60 ? Math.floor(p.tempsS / 60) + " min" + (p.tempsS % 60 ? " " + pad(p.tempsS % 60) : "") : p.tempsS + " s";
  const temp = p.temperature === SANS_CHAUFFE ? "sans chauffe" : p.temperature + " °C";
  return `<br><a class="prog" href="robot.html#programme=${p.tempsS},${p.temperature},${p.vitesse}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10.5h14v4.5a5 5 0 0 1-5 5h-4a5 5 0 0 1-5-5z"/><path d="M3.5 10.5h17"/></svg>Robot : ${t}, ${temp}, vitesse ${p.vitesse === 1 || p.vitesse === 2 ? p.vitesse + "A" : p.vitesse}</a>`;
}

const rappels = {etat: "inconnu"};
function evenementsRappels() {
  const now = new Date(), t = today(), ev = [];
  const liste = repasEntre(t, addDays(t, 14));
  const parJour = {}; for (const x of liste) (parJour[iso(x.d)] ||= []).push(x);
  const aSortir = (d) => (parJour[iso(addDays(d, 1))] || []).map(x => {
    const r = st.recettes[x.m.r]; const veille = (x.m.note || "").match(/[^.]*veille au soir[^.]*/i) || ((r?.etapes || [])[0] || "").match(/^La veille au soir : (.*)/i);
    return veille ? (x.mom === "midi" ? "demain midi" : "demain soir") + " : " + (veille[1] || veille[0]).trim() : null;
  }).filter(Boolean);
  let id = 0;
  for (const x of liste) {
    const r = st.recettes[x.m.r], nom = r ? r.nom : (x.m.libre || "le repas");
    if (x.m.lancer) {
      const [h, mi] = x.m.lancer.split(":").map(Number); const at = new Date(x.d); at.setHours(h, mi, 0, 0);
      const sortir = aSortir(x.d);
      ev.push({id: id++, at, title: "Lancer : " + nom, body: [x.m.note, sortir.length ? "À sortir du congélateur, " + sortir.join(" ; ") : ""].filter(Boolean).join(". ") || "C'est l'heure de lancer le dîner.", page: "index.html#semaine"});
    }
    if (r?.categorie === "Pizza") {
      for (const [h, mi, t1, b1] of [[11, 30, "Pâte à pizza : pétrissage", "Pétrissage au Cook Expert pour les pizzas du soir."], [13, 30, "Pâte à pizza : boulage", "Divise et boule les pâtons, boîte fermée jusqu'au soir."]]) {
        const at = new Date(x.d); at.setHours(h, mi, 0, 0);
        ev.push({id: id++, at, title: t1, body: b1, page: "pizza.html"});
      }
    }
  }
  return ev.filter(e => e.at > now);
}

/* ================= copier ================= */
async function copyText(txt, label) {
  try { await navigator.clipboard.writeText(txt); toast(label + " copiée"); }
  catch (e) {
    openSheet(`<span class="eyebrow">À copier</span><h2>${esc(label)}</h2><p class="muted">La copie automatique n'est pas disponible ici : sélectionne le texte puis copie-le.</p>
      <textarea class="field" id="copyArea" style="min-height:260px">${esc(txt)}</textarea><div class="foot"><span class="grow"></span><button class="btn ghost" data-act="close">Fermer</button></div>`, {kind: "copy"});
    const a = $("#copyArea"); a.focus(); a.select();
  }
}
function texteClaude() {
  const c = coursesDoc(), {items, besoins} = listeCourses(), [d0, d1] = periodeRange();
  const lec = items.filter(x => x.e === "LEC" && !c.coches[x.key]);
  const prods = (st.drive?.produits || []).map(p => [p, produitsQte(p, besoins)]).filter(([p, q]) => q > 0 && !c.coches["p:" + p.id]);
  let t = `Remplis mon panier Leclerc Drive (Blois) pour les repas du ${fmtDay(d0)} au ${fmtDay(d1)}.\n\nProduits habituels (id drive) :\n`;
  t += prods.map(([p, q]) => `- ${q} × ${p.nom}, ${p.format} (id ${p.id})${p.note ? " — " + p.note : ""}${besoins[p.id] ? " — aussi pour " + besoins[p.id].pour.join(", ") : ""}`).join("\n") || "- aucun";
  t += `\n\nÀ trouver pour les recettes (règle bio ≤ +30 %, sinon marques nationales) :\n` + (lec.map(x => `- ${x.n}${x.surg ? " (surgelé)" : ""}${x.qtxt ? " : " + x.qtxt : ""}`).join("\n") || "- rien");
  const pla = items.filter(x => x.e === "PLA" && !c.coches[x.key]);
  if (pla.length) t += `\n\nPlacard non coché, à vérifier ou à ajouter :\n` + pla.map(x => `- ${x.n}`).join("\n");
  return t;
}
function texteGF() {
  const c = coursesDoc(), {items} = listeCourses();
  const its = items.filter(x => x.e === "GF" && !c.coches[x.key]).sort((a, b) => rangRayon("GF", a.rayon) - rangRayon("GF", b.rayon) || a.n.localeCompare(b.n, "fr"));
  let t = "Grand Frais", r = null;
  for (const x of its) { if ((x.rayon || "Divers") !== r) { r = x.rayon || "Divers"; t += "\n\n" + r; } t += `\n- ${x.n}${x.qtxt ? " : " + x.qtxt : ""}`; }
  return t;
}

/* ================= rendu global ================= */
const TITRES = {semaine: "Semaine", courses: "Courses", recettes: "Recettes", reperes: "Repères"};
let vueAffichee = null;
function render() {
  $("#viewTitle").textContent = TITRES[ui.view];
  if (vueAffichee !== ui.view) { vueAffichee = ui.view; window.animerUneFois?.($("#v-" + ui.view), "entree", 700); }
  for (const v of Object.keys(TITRES)) $("#v-" + v).hidden = ui.view !== v;
  document.querySelectorAll(".barre-bas a[data-view]").forEach(a => { if (a.dataset.view === ui.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  $("#lienReperes").hidden = ui.view === "reperes";
  if (ui.view === "semaine") renderSemaine(); else if (ui.view === "courses") renderCourses(); else if (ui.view === "reperes") renderReperes(); else renderRecettes();
  if (sheet?.kind === "recipe") renderRecipeSheet();
}
function route() { const h = location.hash.replace("#", ""); ui.view = TITRES[h] ? h : "semaine"; if (cu) fermerCuisine(); render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", () => (window.transitionVue || (f => f()))(route));

/* ================= événements ================= */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (b.tagName === "A" && a !== "close") ev.preventDefault();
  const c = coursesDoc();
  switch (a) {
    case "weekPrev": ui.week = iso(addDays(parse(ui.week), -7)); ui.glisse = "va-g"; render(); break;
    case "weekNext": ui.week = iso(addDays(parse(ui.week), 7)); ui.glisse = "va-d"; render(); break;
    case "toToday": ui.week = iso(weekStartOf(today())); render(); break;
    case "goCourses": ui.periode = "w:" + ui.week; saveUi(); location.hash = "courses"; break;
    case "editMeal": openMeal(b.dataset.k); break;
    case "copyWeek": {
      const to = $("#copyTo").value, from = ui.week, off = daysBetween(parse(from), parse(to)), src = st.semaines[from]?.repas || {};
      const w = st.semaines[to] || (st.semaines[to] = {debut: to, repas: {}}); w.repas ||= {};
      for (const [k, m] of Object.entries(src)) { const [ds, mom] = k.split("_"); w.repas[iso(addDays(parse(ds), off)) + "_" + mom] = {...m}; }
      saveWeek(to); ui.week = to; render(); toast("Semaine recopiée"); break; }
    case "askClear": $("#clearZone").innerHTML = `<div class="confirm">Retirer tous les repas de cette semaine ?<button class="btn danger" data-act="clearWeek">Vider</button><button class="btn ghost" data-act="noClear">Garder</button></div>`; break;
    case "noClear": $("#clearZone").innerHTML = ""; break;
    case "clearWeek": st.semaines[ui.week] = {debut: ui.week, repas: {}}; saveWeek(ui.week); render(); toast("Semaine vidée"); break;
    // repas
    case "mPick": readMealInputs(); sheet.r = sheet.r === b.dataset.id ? null : b.dataset.id; if (sheet.r) { const r = st.recettes[sheet.r]; if (r?.unite === "pizzas") sheet.p = r.portions; } renderMealSheet(); break;
    case "mP": readMealInputs(); sheet.p = Math.max(1, Math.min(12, sheet.p + Number(b.dataset.d))); renderMealSheet(); break;
    case "mSave": saveMeal(); break;
    case "mDel": { const w = st.semaines[sheet.ws]; if (w?.repas) delete w.repas[sheet.key]; saveWeek(sheet.ws); closeSheet(); render(); toast("Repas retiré"); break; }
    case "close": ev.preventDefault(); closeSheet(); break;
    // recettes
    case "openRecipe": if (sheet?.kind === "meal") closeSheet(); openRecipe(b.dataset.id); break;
    case "cuisiner": ouvrirCuisine(b.dataset.id, Number(b.dataset.p) || null); break;
    case "cuFermer": fermerCuisine(); break;
    case "cuPrec": if (cu.i > 0) { cu.i--; cu.dir = "va-g"; renderCuisine(); } break;
    case "cuSuiv": if (cu.i < cu.etapes.length - 1) { cu.i++; cu.dir = "va-d"; renderCuisine(); } break;
    case "cuFin": try { localStorage.removeItem("cuisine/en-cours"); } catch (e) {} fermerCuisine(); toast("Bon appétit"); break;
    case "rappelsOn": majRappels(true); break;
    case "actualiser": location.reload(); break;
    case "copyModifs": { const m = st.db?.modifications?.() || {}; const n = Object.keys(m).length;
      if (!n) { toast("Aucune modification faite sur le téléphone."); break; }
      copyText("Modifications faites dans l'appli Cuisine (à reporter dans data/cuisine.json) :\n" + JSON.stringify(m, null, 1), "Liste des modifications"); break; }
    case "rP": sheet.p = Math.max(1, Math.min(24, sheet.p + Number(b.dataset.d))); renderRecipeSheet(); break;
    case "rPlan": {
      const key = $("#rs-slot").value, ws = iso(weekStartOf(parse(key.split("_")[0]))), r = st.recettes[sheet.id];
      const w = st.semaines[ws] || (st.semaines[ws] = {debut: ws, repas: {}}); w.repas ||= {};
      w.repas[key] = {r: sheet.id, p: r?.unite === "pizzas" ? r.portions : 2}; saveWeek(ws); toast("Ajouté au planning : " + $("#rs-slot").selectedOptions[0].textContent); break; }
    case "rEdit": openRecipeForm(sheet.id); break;
    case "rAskDel": sheet.confirm = true; renderRecipeSheet(); break;
    case "rNoDel": sheet.confirm = false; renderRecipeSheet(); break;
    case "rDel": { const id = sheet.id; delete st.recettes[id]; del("recettes/" + id); closeSheet(); render(); toast("Recette supprimée"); break; }
    case "newRecipe": openRecipeForm(null); break;
    case "rfApp": { const v = b.dataset.v, i = sheet.apps.indexOf(v); if (i >= 0) sheet.apps.splice(i, 1); else sheet.apps.push(v); b.setAttribute("aria-pressed", i < 0); break; }
    case "rCourt": ui.rCourt = !ui.rCourt; renderRecettes(); break;
    case "rSrc": ui.rSrc = !ui.rSrc; renderRecettes(); break;
    case "rApp": ui.rApp = ui.rApp === b.dataset.v ? null : b.dataset.v; renderRecettes(); break;
    // courses
    case "periode": ui.periode = b.dataset.v; saveUi(); renderCourses(); break;
    case "picard": c.picard = !c.picard; saveCourses(true); renderCourses(); break;
    case "hideDone": ui.hideDone = !ui.hideDone; saveUi(); renderCourses(); break;
    case "pq": { const p = (st.drive?.produits || []).find(x => x.id === b.dataset.id); if (!p) break; c.driveQte[p.id] = Math.max(0, Math.min(20, produitsQte(p, listeCourses().besoins) + Number(b.dataset.d))); saveCourses(); renderCourses(); break; }
    case "copyClaude": copyText(texteClaude(), "Liste pour Claude"); break;
    case "copyGF": copyText(texteGF(), "Liste Grand Frais"); break;
    case "askReset": $("#resetZone").innerHTML = `<div class="confirm">Tout décocher, retirer les ajouts et revenir aux quantités habituelles ?<button class="btn danger" data-act="reset">Nouvelle liste</button><button class="btn ghost" data-act="noReset">Annuler</button></div>`; break;
    case "noReset": $("#resetZone").innerHTML = ""; break;
    // repères
    case "rpEdit": openRpEdit(b.dataset.k); break;
    case "rpSave": { const rp = st.reperes || {}; rp[sheet.k] = textToLignes($("#rp-txt").value); st.reperes = rp; write("config/reperes", rp); closeSheet(); render(); toast("Règles enregistrées"); break; }
    case "eqOpen": openEq(b.dataset.id); break;
    case "eqNew": openEq(null); break;
    case "eqDel": { const id = sheet.id; delete st.equipement[id]; del("equipement/" + id); closeSheet(); render(); toast("Appareil retiré"); break; }
    case "reset": st.courses = {coches: {}, ajouts: [], driveQte: {}, picard: c.picard}; saveCourses(true); renderCourses(); toast("Nouvelle liste prête"); break;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.act === "todo" && st.reperes) {
    const x = st.reperes.aCompleter[Number(t.dataset.i)]; if (x) { x.fait = t.checked; write("config/reperes", st.reperes); renderReperes(); }
  }
  if (t.dataset.act === "check") {
    const c = coursesDoc(), k = t.dataset.key;
    if (t.checked) { c.coches[k] = true; ui.vientDe = k; } else delete c.coches[k];
    saveCourses(); renderCourses();
  }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "ms-q") { readMealInputs(); sheet.q = ev.target.value; const pos = ev.target.selectionStart; renderMealSheet(); const n = $("#ms-q"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
  if (ev.target.id === "rq") { ui.rq = ev.target.value; renderRecettes(); }
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "rform") submitRecipeForm();
  if (ev.target.id === "eqform") saveEq();
  if (ev.target.id === "addForm") {
    const n = $("#addName").value.trim(); if (!n) return;
    const c = coursesDoc(); c.ajouts.push({id: Date.now().toString(36), n, e: $("#addEns").value});
    $("#addName").value = ""; saveCourses(true); renderCourses(); toast("Ajouté");
  }
});
$("#scrim").addEventListener("click", closeSheet);
document.querySelector(".barre-bas").addEventListener("click", () => { if (cu) fermerCuisine(); if (sheet) closeSheet(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { if (cu) fermerCuisine(); else if (sheet) closeSheet(); } });
// Retour arrière Android (MainActivity) : ferme d'abord le mode cuisine ou la feuille ouverte
window.surRetour = () => { if (cu) { fermerCuisine(); return true; } if (sheet) { closeSheet(); return true; } return false; };
document.addEventListener("visibilitychange", () => { if (!document.hidden && cu) window.Natif?.garderAllume(true); if (!document.hidden && ui.view === "semaine" && !sheet) renderSemaine(); });

/* ================= connexion aux données ================= */
// window.claude.use("db") est fourni par commun/natif.js : base sur le téléphone, complétée à l'ouverture
// par data/cuisine.json du dépôt GitHub (menus et recettes préparés par Claude).
function setSync() {}
const rerender = () => render();
async function connect() {
  const db = await window.claude.use("db");
  st.db = db;
  const err = () => {};
  db.collection("recettes").onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); st.recettes = o; st.loaded.r = true; if (!sheet) rerender(); }, err);
  db.collection("semaines").onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); st.semaines = o; st.loaded.s = true; if (!sheet) render(); majRappels(); }, err);
  db.doc("config/articles").onSnapshot(d => { st.articles = d.exists ? d.data() : null; if (ui.view === "courses" && !sheet) renderCourses(); }, err);
  db.doc("config/drive").onSnapshot(d => { st.drive = d.exists ? d.data() : null; st.loaded.d = true; if (ui.view === "courses" && !sheet) renderCourses(); }, err);
  db.doc("config/reglages").onSnapshot(d => { if (d.exists) st.reglages = {...st.reglages, ...d.data()}; st.loaded.g = true; if (ui.view === "semaine" && !sheet) renderSemaine(); }, err);
  db.doc("config/reperes").onSnapshot(d => { st.reperes = d.exists ? d.data() : {}; if (ui.view === "reperes" && !sheet) renderReperes(); }, err);
  db.collection("equipement").onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); st.equipement = o; if (ui.view === "reperes" && !sheet) renderReperes(); }, err);
  db.doc("courses/actuel").onSnapshot(d => { st.courses = d.exists ? d.data() : null; st.loaded.c = true; if (ui.view === "courses" && !sheet) renderCourses(); }, err);
}

route();
connect();
})();
</script>
